id: CVE-2021-44228-log4j-rce

info:
  name: Apache Log4j2 JNDI RCE
  author:
    - pdteam
    - dwisiswant0
  severity: Critical
  description: Apache Log4j2 <=2.14.1 JNDI lookup remote code execution.
  reference:
    - https://nvd.nist.gov/vuln/detail/CVE-2021-44228
  classification:
    cve-id:
      - CVE-2021-44228
    cwe-id:
      - CWE-502
    cvss-score: 10.0
  tags: log4j,rce,jndi

requests:
  - method: POST
    path:
      - "{{BaseURL}}/api/login"
    matchers:
      - type: word
        words:
          - "JNDI"
