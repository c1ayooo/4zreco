# CI 门禁:构建 + 静态检查 + 全量测试(需要 PostgreSQL,测试基建见 db/testmain_test.go)
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: 4zreco
          POSTGRES_PASSWORD: 4zrecotest
          POSTGRES_DB: 4zreco_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U 4zreco"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      ZRECO_PG_DSN: postgres://4zreco:4zrecotest@localhost:5432/4zreco_test?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      # Eino 接入架构红线门禁（docs/Eino深度接入方案-2026-11-05.md §8.2）。
      # 依赖 go 工具链（内部跑 go list -deps ./internal/db），故排在 setup-go 之后。
      # 注意：脚本必须保持可执行位（见 a9dffbc 教训，丢位会导致 exit 126）。
      - name: Eino boundary check
        run: ./scripts/check-eino-boundary.sh
      - name: Test
        # -p 1: 连 PG 的测试包不止持有跨包 advisory lock 的 db/agent/server 三个
        # (llmrec/evidence/traffic 等无锁),CI 多核并行时与 agent 包写事务死锁
        # (SQLSTATE 40P01,两轮稳定复现)。串行跑包与 TestMain 的锁设计意图一致。
        run: go test -p 1 ./... -count=1

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
        working-directory: web
      # lint 暂不进门禁：存量 75 个 error 均为行为级修复（空 catch 补处理、悬浮
      # Promise 补 await、a11y），与最小 diff 原则冲突，留作独立治理任务；
      # build:static 已覆盖 TS 类型检查与静态导出验证。
      - name: Build (static export)
        run: npm run build:static
        working-directory: web
